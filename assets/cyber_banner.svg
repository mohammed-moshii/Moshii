<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#00e5ff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#bd00ff" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="50%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00e5ff" stroke-width="0.5" stroke-opacity="0.1" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="240" rx="14" fill="url(#darkBg)" />
  <rect width="1000" height="240" rx="14" fill="url(#grid)" />
  <rect width="996" height="236" x="2" y="2" rx="12" fill="none" stroke="url(#cyberGrad)" stroke-width="1.5" stroke-opacity="0.55" />

  <!-- Corner Brackets -->
  <path d="M 22 45 L 22 22 L 45 22" fill="none" stroke="#00ff88" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 978 45 L 978 22 L 955 22" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 22 195 L 22 218 L 45 218" fill="none" stroke="#00ff88" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 978 195 L 978 218 L 955 218" fill="none" stroke="#bd00ff" stroke-width="3.5" stroke-linecap="round" />

  <!-- Status Bar -->
  <circle cx="45" cy="38" r="4.5" fill="#00ff88" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="60" y="42" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="bold" fill="#00ff88" letter-spacing="2">SYSTEM STATUS: AUTHORIZED ROOT ACCESS</text>
  <text x="955" y="42" text-anchor="end" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="bold" fill="#00e5ff" letter-spacing="2">SEC-OPS: RED TEAM // TOP 1% THM</text>

  <!-- Title -->
  <text x="500" y="118" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="900" fill="url(#cyberGrad)" filter="url(#glow)" letter-spacing="8">MOHAMMED MOSHII</text>
  <text x="500" y="154" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="15" font-weight="bold" fill="#ffffff" letter-spacing="4">PENETRATION TESTER  ·  RED TEAM OPERATOR  ·  MALWARE ANALYST</text>
  <text x="500" y="184" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="bold" fill="#00e5ff" letter-spacing="3">EC-COUNCIL CEH  |  CERTIFIED SOC ANALYST (CSA)  |  CAIRO UNIVERSITY CS</text>

  <!-- Bottom Circuit -->
  <line x1="120" y1="210" x2="880" y2="210" stroke="url(#cyberGrad)" stroke-width="1.2" stroke-opacity="0.6" />
  <circle cx="500" cy="210" r="4" fill="#00ff88" filter="url(#glow)" />
  <rect x="250" y="208.5" width="30" height="3" fill="#00e5ff" />
  <rect x="720" y="208.5" width="30" height="3" fill="#bd00ff" />
</svg>